<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <link id="colores-dinamicos" rel="stylesheet" href="./colores.css">
    <title>Generador de paletas</title>
</head>
<body>
    <header>
        <h1>Generador de paletas</h1>
        <p>Generá una combinación de colores para tu próximo proyecto.</p>
    </header>

    <main>
        <section aria-labelledby="titulo-controles">
            <h2 id="titulo-controles">Creá tu paleta</h2>

            <fieldset class="selector-cantidad">
    <legend>Cantidad de colores</legend>

    <div class="cantidad-opciones">
        <input
            class="cantidad-radio"
            type="radio"
            name="cantidad"
            id="cantidad-6"
            value="6"
            checked
        >
        <label class="cantidad-opcion" for="cantidad-6">
            <span class="cantidad-numero">6</span>
            <span class="cantidad-texto">colores</span>
        </label>

        <input
            class="cantidad-radio"
            type="radio"
            name="cantidad"
            id="cantidad-8"
            value="8"
        >
        <label class="cantidad-opcion" for="cantidad-8">
            <span class="cantidad-numero">8</span>
            <span class="cantidad-texto">colores</span>
        </label>

        <input
            class="cantidad-radio"
            type="radio"
            name="cantidad"
            id="cantidad-9"
            value="9"
        >
        <label class="cantidad-opcion" for="cantidad-9">
            <span class="cantidad-numero">9</span>
            <span class="cantidad-texto">colores</span>
        </label>
    </div>
</fieldset>

            <button id="generar" type="button">
    <span class="generar-icono" aria-hidden="true">✦</span>
    <span>Generar paleta</span>
</button>
        </section>

        <section aria-labelledby="titulo-paleta">
            <h2 id="titulo-paleta">Tu paleta</h2>

            <div id="paleta"></div>
        </section>

        <p id="mensaje" role="status"></p>
    </main>

    <footer>
        <p>Proyecto integrador de Nicolás Gregorio</p>
    </footer>
    <script src="./script.js"></script>
</body>
</html>
